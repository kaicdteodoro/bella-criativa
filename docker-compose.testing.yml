services:
  test:
    build:
      context: .
      dockerfile: docker/local/php/Dockerfile
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: /app/database/database.sqlite
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    command: php artisan test
